[project]
name = "givenaija-backend"
version = "0.1.0"
description = "GiveNaija — NGO Donations & Members API (Team Mighty Spark)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework and ASGI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Configuration & Settings management (12-Factor habit: config in env)
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.8.0",

    # Database ORM, Migrations & Drivers
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",

    # Authentication & Security
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",

    # Caching & Rate Limiting
    "redis>=5.0.0",

    # SSE (Server-Sent Events) streaming
    "sse-starlette>=2.1.0",

    # Firestore for donation & activity feeds
    "google-cloud-firestore>=2.18.0",

    # Async HTTP client (for background tasks/testing)
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
# Run in strict asyncio mode so every async test needs @pytest.mark.asyncio
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Show short test summaries for all failures and errors
addopts = "-v --tb=short -q"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/firestore.py",   # Covered by Firestore emulator in CI
    "seed.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
